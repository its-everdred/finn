<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RestoreBound</title>
<style>
  :root { --controls-h: 0px; }
  html, body { margin: 0; height: 100%; background: #0b0b14; color: #e8e8f0; font-family: monospace; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* the game: as wide as the screen allows, but never taller than what is left after the controls */
  #stage { position: relative; width: min(100vw, calc((100dvh - var(--controls-h) - 16px) * 4 / 3), 1280px); aspect-ratio: 4 / 3; flex: none; }
  #startgate { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(11,11,20,.82); border: 0; color: #f2d05c; font-family: monospace; cursor: pointer; }
  #startgate .big { font-size: clamp(22px, 5vw, 40px); letter-spacing: 2px; }
  #startgate .small { font-size: 14px; color: #cfcfd8; }
  #startgate[hidden] { display: none; }
  canvas#game { position: absolute; inset: 0; width: 100% !important; height: 100% !important; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  /* the name field: a real text input so phones and tablets bring up a keyboard */
  #namewrap { display: none; width: min(100vw, 960px); padding: 0 12px; box-sizing: border-box; }
  body[data-naming="1"] #namewrap { display: flex; gap: 8px; }
  #namebox { flex: 1; font: inherit; font-size: 18px; padding: 10px 12px; background: #14142a; color: #f2d05c; border: 2px solid #f2d05c; border-radius: 6px; outline: none; -webkit-user-select: text; user-select: text; }
  #nameok { font: inherit; font-size: 16px; background: #f2d05c; color: #0b0b14; border: 0; border-radius: 6px; padding: 0 18px; }
  /* touch controls: below the game, never over it; only on coarse pointers */
  #touch { display: none; width: 100%; max-width: 960px; padding: 4px 4vw 8px; box-sizing: border-box; justify-content: space-between; align-items: center; }
  @media (pointer: coarse) { :root { --controls-h: 190px; } #touch { display: flex; } .kbd { display: none; } }
  .pad { width: min(38vw, 180px); aspect-ratio: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; }
  .pad button { padding: 0; border-radius: 10px; background: #14142a; border: 1px solid rgba(242,208,92,.7); color: #f2d05c; font-size: 24px; }
  .pad .u { grid-area: 1 / 2; } .pad .l { grid-area: 2 / 1; } .pad .r { grid-area: 2 / 3; } .pad .d { grid-area: 3 / 2; }
  .btns { display: flex; gap: 16px; align-items: flex-end; }
  .btns button { width: min(20vw, 96px); aspect-ratio: 1; border-radius: 50%; background: #14142a; border: 2px solid rgba(242,208,92,.8); color: #f2d05c; font-size: 20px; padding: 0; }
  .btns .b { width: min(15vw, 72px); margin-bottom: 10px; border-color: rgba(143,211,255,.8); color: #8fd3ff; }
  /* the pad is a joystick: the .pad element takes every touch; its buttons are only the graphic */
  .pad { touch-action: none; position: relative; }
  .pad button { pointer-events: none; }
  .pad button.on, .btns button:active { background: #f2d05c; color: #0b0b14; }
  a { color: #8fd3ff; }
  /* settings live behind a gear in the corner so nothing is pressed by accident mid-game */
  #gear { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); z-index: 20; width: 40px; height: 40px; border-radius: 50%; background: rgba(20,20,42,.85); color: #cfcfd8; border: 1px solid rgba(207,207,216,.5); font-size: 22px; line-height: 1; cursor: pointer; }
  #gear:hover, #gear.open { color: #f2d05c; border-color: #f2d05c; }
  #settings { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 46px); right: max(8px, env(safe-area-inset-right)); z-index: 20; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #14142a; border: 1px solid #f2d05c; border-radius: 8px; font-size: 12px; min-width: 200px; }
  #settings[hidden] { display: none; }
  #settings button { font: inherit; font-size: 13px; background: #0b0b14; color: #f2d05c; border: 1px solid #f2d05c; border-radius: 4px; padding: 8px 10px; cursor: pointer; text-align: left; }
  #settings a { padding: 4px 2px; }
  #settings .kbd { color: #8a8a99; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" tabindex="0"></canvas>
    <button id="startgate" aria-label="tap to play">
      <span class="big">&#9654; TAP TO PLAY</span>
      <span class="small">turns the sound on</span>
    </button>
  </div>
  <div id="namewrap">
    <input id="namebox" type="text" maxlength="10" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="type a name">
    <button id="nameok">OK</button>
  </div>
  <div id="touch">
    <div class="pad">
      <button class="u" data-key="ArrowUp" aria-label="up">&#9650;</button>
      <button class="l" data-key="ArrowLeft" aria-label="left">&#9664;</button>
      <button class="r" data-key="ArrowRight" aria-label="right">&#9654;</button>
      <button class="d" data-key="ArrowDown" aria-label="down">&#9660;</button>
    </div>
    <div class="btns">
      <button class="b" data-key="/" aria-label="back">B</button>
      <button class="a" data-key=" " aria-label="confirm">A</button>
    </div>
  </div>
  <button id="gear" aria-label="settings" title="Settings">&#9881;</button>
  <div id="settings" hidden>
    <button id="mute" title="Toggle music">Mute (M)</button>
    <button id="restart" title="Erase saved progress and start from the beginning">Restart from beginning</button>
    <a href="../../">all games</a>
    <span class="kbd">Arrows / WASD to move &middot; SPACE confirm &middot; / back &middot; M mute</span>
  </div>
  <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
  <script>
    // Always fetch the newest build: GitHub Pages caches these files for ~10 minutes, so a plain
    // refresh could otherwise mix an old game.js with a new sprites.js. Synchronous writes keep order.
    (function () { const v = Date.now(); ["music.js", "sprites.js", "decor.js"].forEach((f) => document.write('<script src="' + f + '?v=' + v + '"><\/script>')); window.__buildV = v; })();
  </script>
  <script>
    const canvas = document.getElementById("game");
    const gear = document.getElementById("gear"), settings = document.getElementById("settings");
    const closeSettings = () => { settings.hidden = true; gear.classList.remove("open"); };
    gear.addEventListener("click", (e) => { e.stopPropagation(); settings.hidden = !settings.hidden; gear.classList.toggle("open", !settings.hidden); });
    document.addEventListener("click", (e) => { if (!settings.hidden && !settings.contains(e.target)) closeSettings(); });
    // The start gate is a real button: its click is the user gesture that unlocks audio on iOS.
    const gate = document.getElementById("startgate");
    const openGate = () => { window.music.unlock(); gate.hidden = true; canvas.focus(); };
    gate.addEventListener("click", openGate);
    document.getElementById("restart").addEventListener("click", () => {
      if (confirm("Erase your saved game and start over?")) { window.restoreboundRestart(); closeSettings(); canvas.focus(); }
    });
    document.getElementById("mute").addEventListener("click", (e) => {
      const m = window.music.toggleMute(); e.target.textContent = m ? "Unmute (M)" : "Mute (M)"; closeSettings(); canvas.focus();
    });
    // Every on-screen control synthesizes the keyboard event the game already understands.
    const CODES = { ArrowUp: "ArrowUp", ArrowDown: "ArrowDown", ArrowLeft: "ArrowLeft", ArrowRight: "ArrowRight", " ": "Space", "/": "Slash", Enter: "Enter", Backspace: "Backspace" };
    function fire(type, key) {
      const ev = new KeyboardEvent(type, { key, code: CODES[key] || ("Key" + key.toUpperCase()), bubbles: true, cancelable: true });
      canvas.dispatchEvent(ev); document.dispatchEvent(ev);
    }
    function tap(key) { fire("keydown", key); setTimeout(() => fire("keyup", key), 40); }
    document.querySelectorAll("#touch .btns button").forEach((b) => {
      const key = b.dataset.key; let down = false;
      const press = (e) => { e.preventDefault(); window.music.unlock(); if (!down) { down = true; fire("keydown", key); } };
      const release = (e) => { e.preventDefault(); if (down) { down = false; fire("keyup", key); } };
      b.addEventListener("touchstart", press, { passive: false });
      b.addEventListener("touchend", release, { passive: false });
      b.addEventListener("touchcancel", release, { passive: false });
      b.addEventListener("mousedown", press); b.addEventListener("mouseup", release); b.addEventListener("mouseleave", release);
    });
    // The d-pad is an 8-way virtual joystick. Any touch on the pad is measured from the pad's centre;
    // past a small deadzone its angle picks one of 8 directions, and the matching arrow key(s) are
    // held down. Diagonals hold two arrows at once (the game already combines them).
    (function joystick() {
      const pad = document.querySelector("#touch .pad");
      if (!pad) return;
      const DIRS = [["ArrowRight"], ["ArrowRight", "ArrowDown"], ["ArrowDown"], ["ArrowLeft", "ArrowDown"],
                    ["ArrowLeft"], ["ArrowLeft", "ArrowUp"], ["ArrowUp"], ["ArrowRight", "ArrowUp"]];
      const GLYPH = { ArrowUp: ".u", ArrowLeft: ".l", ArrowRight: ".r", ArrowDown: ".d" };
      let held = new Set(), touchId = null, mouse = false;
      function setHeld(next) {
        for (const k of held) if (!next.has(k)) { fire("keyup", k); pad.querySelector(GLYPH[k]).classList.remove("on"); }
        for (const k of next) if (!held.has(k)) { fire("keydown", k); pad.querySelector(GLYPH[k]).classList.add("on"); }
        held = next;
      }
      function aim(clientX, clientY) {
        const r = pad.getBoundingClientRect();
        const dx = clientX - (r.left + r.width / 2), dy = clientY - (r.top + r.height / 2);
        const dead = Math.min(r.width, r.height) * 0.12;
        if (Math.hypot(dx, dy) < dead) { setHeld(new Set()); return; }
        const sector = (Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8;
        setHeld(new Set(DIRS[sector]));
      }
      const release = () => { touchId = null; mouse = false; setHeld(new Set()); };
      function findTouch(list) { for (const t of list) if (t.identifier === touchId) return t; return null; }
      pad.addEventListener("touchstart", (e) => {
        e.preventDefault(); window.music.unlock();
        if (touchId === null) touchId = e.changedTouches[0].identifier;
        const t = findTouch(e.touches); if (t) aim(t.clientX, t.clientY);
      }, { passive: false });
      pad.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const t = findTouch(e.changedTouches); if (t) aim(t.clientX, t.clientY);
      }, { passive: false });
      const end = (e) => { e.preventDefault(); if (findTouch(e.changedTouches)) release(); };
      pad.addEventListener("touchend", end, { passive: false });
      pad.addEventListener("touchcancel", end, { passive: false });
      // mouse, for desktop testing
      pad.addEventListener("mousedown", (e) => { e.preventDefault(); mouse = true; aim(e.clientX, e.clientY); });
      window.addEventListener("mousemove", (e) => { if (mouse) aim(e.clientX, e.clientY); });
      window.addEventListener("mouseup", () => { if (mouse) release(); });
      window.addEventListener("blur", release);
    })();
    // Name entry: the game flags data-naming on <body>; the text field mirrors its value into the game
    // by replaying the difference as key presses, and OK / Enter submits.
    const box = document.getElementById("namebox");
    let mirrored = "";
    window.rbNaming = (active, value) => {
      document.body.dataset.naming = active ? "1" : "0";
      if (active) { mirrored = value || ""; box.value = mirrored; if (matchMedia("(pointer: coarse)").matches) setTimeout(() => box.focus(), 50); }
      else { box.blur(); canvas.focus(); }
    };
    box.addEventListener("input", () => {
      const v = box.value.replace(/[^a-zA-Z0-9 ]/g, "").slice(0, 10);
      let common = 0; while (common < mirrored.length && common < v.length && mirrored[common] === v[common]) common++;
      for (let i = mirrored.length; i > common; i--) tap("Backspace");
      for (let i = common; i < v.length; i++) tap(v[i]);
      mirrored = v; box.value = v;
    });
    const submit = () => { window.music.unlock(); tap("Enter"); };
    box.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
    document.getElementById("nameok").addEventListener("click", submit);
    document.getElementById("stage").addEventListener("touchend", () => window.music.unlock(), { passive: true });
  </script>
  <script>document.write('<script src="game.js?v=' + window.__buildV + '"><\/script>');</script>
</body>
</html>
