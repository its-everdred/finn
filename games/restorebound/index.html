<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RestoreBound</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b14; color: #e8e8f0; font-family: monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; outline: none; max-width: 100vw; max-height: 100vh; }
  .bar { display: flex; gap: 12px; align-items: center; font-size: 12px; opacity: .75; padding: 0 12px; text-align: center; flex-wrap: wrap; justify-content: center; }
  a { color: #8fd3ff; }
  button { font: inherit; font-size: 12px; background: #14142a; color: #f2d05c; border: 1px solid #f2d05c; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #f2d05c; color: #0b0b14; }
</style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div class="bar">
    <span>Arrows, numpad or WASD to move &middot; SPACE to talk &amp; confirm &middot; / to go back</span>
    <button id="mute" title="Toggle music">Mute (M)</button>
    <button id="restart" title="Erase saved progress and start from the beginning">Restart from beginning</button>
    <a href="../../">all games</a>
  </div>
  <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
  <script src="music.js"></script>
  <script src="sprites.js"></script>
  <script src="game.js"></script>
  <script>
    document.getElementById("restart").addEventListener("click", () => {
      if (confirm("Erase your saved game and start over?")) { window.restoreboundRestart(); document.getElementById("game").focus(); }
    });
    document.getElementById("mute").addEventListener("click", (e) => {
      const m = window.music.toggleMute(); e.target.textContent = m ? "Unmute (M)" : "Mute (M)"; document.getElementById("game").focus();
    });
  </script>
</body>
</html>
